name: Discord Commit Notifications

on:
  push:
    branches:
      - "main"

permissions:
  contents: read

jobs:
  notify-discord:
    runs-on: ubuntu-latest

    steps:
      - name: Generate Discord embed
        env:
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          COMPARE_URL: ${{ github.event.compare }}
          COMMITS_JSON: ${{ toJSON(github.event.commits) }}
        run: |
          python3 - <<'PY'
          import json
          import os

          commits = json.loads(os.environ["COMMITS_JSON"])
          lines = []

          for commit in commits[:10]:
              message = commit["message"].splitlines()[0]
              sha = commit["id"][:7]
              url = commit["url"]
              lines.append(f"[`{sha}`]({url}) {message}")

          if len(commits) > 10:
              lines.append(
                  f"...and {len(commits) - 10} more commits."
              )

          if not lines:
              lines.append("No commit details available.")

          payload = {
              "embeds": [{
                  "title": f"🚀 New push to {os.environ['REPO']}",
                  "url": os.environ["COMPARE_URL"],
                  "color": 5793266,
                  "description": "\n".join(lines)[:4000],
                  "fields": [
                      {
                          "name": "Branch",
                          "value": f"`{os.environ['BRANCH']}`",
                          "inline": True
                      },
                      {
                          "name": "Pushed by",
                          "value": os.environ["ACTOR"],
                          "inline": True
                      }
                  ],
                  "footer": {
                      "text": "GitHub Actions"
                  }
              }]
          }

          with open("discord-payload.json", "w") as f:
              json.dump(payload, f)
          PY

      - name: Send Discord notification
        uses: tsickert/discord-webhook@v7.0.0
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          raw-data: discord-payload.json
