<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>Vexruna | Home</title>
		<link href="css/style.css" rel="stylesheet">
	</head>
	<body>
		<header>
			<img src="assets/logo.png" class="logo" alt="MyLogo">
			<!-- Mobile Menu Button -->
			<nav class="header-nav">
				<button type="button" class="hamburger-menu" aria-label="Toggle menu" aria-expanded="false">
					<span class="bar"></span>
					<span class="bar"></span>
					<span class="bar"></span>
				</button>
				<div class="nav-tabs">
					<button class="navtab" type="button" data-hero="bio" id="bioButton">Bio</button>
					<button class="navtab" type="button" data-hero="projects" id="projectsButton">Projects</button>
					<button class="navtab" type="button" data-hero="gallery" id="galleryButton">Gallery</button>
					<button class="navtab" type="button" data-hero="discography" id="discographyButton">Discography</button>
					<button class="navtab" type="button" data-hero="contact" id="contactButton">Contact</button>
				</div>
			</nav>
		</header>
		<main class="hero">
			<div class="hero-content">
				<h1 id="hero-title">Welcome</h1>
				<p id="hero-text">Thanks for checking out my website. <br>
					It is currently under construction. <br>
					You can use the navigation tabs above for more information.</p>
			</div>
		</main>
		<footer>
			<p>Prototype version © vexruna</p>
		</footer>
		<script type="module" src="js/index.js">
		</script>
	</body>
</html>
